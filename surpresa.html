<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b2b">
    <title>Uma surpresa para você!</title>
    <style>
         :root {
            color-scheme: dark;
            font-family: Georgia, "Times New Roman", serif;
            background: #090b2b;
            color: #fff8e7;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100%;
            margin: 0;
        }
        
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
            text-align: center;
            background: radial-gradient(1px 1px at 12% 19%, #fff 98%, transparent), radial-gradient(2px 2px at 77% 27%, #ffe9a8 98%, transparent), radial-gradient(1px 1px at 42% 71%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 88% 83%, #fff 98%, transparent), radial-gradient(1px 1px at 24% 91%, #c9d9ff 98%, transparent), linear-gradient(145deg, #090b2b, #171044 55%, #090b2b);
            background-size: 190px 190px, 260px 260px, 230px 230px, 300px 300px, 210px 210px, cover;
        }
        
        body::before,
        body::after {
            position: fixed;
            inset: 0;
            pointer-events: none;
            content: "";
            background-image: radial-gradient(1px 1px at 25% 35%, #fff 98%, transparent), radial-gradient(1px 1px at 68% 62%, #fff4ca 98%, transparent);
            background-size: 170px 170px, 240px 240px;
            animation: piscar 3s ease-in-out infinite alternate;
        }
        
        body::after {
            animation-delay: -1.5s;
            transform: rotate(17deg);
            opacity: .55;
        }
        
        @keyframes piscar {
            from {
                opacity: .2;
            }
            to {
                opacity: .8;
            }
        }
        
        #fogos {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        main {
            position: relative;
            z-index: 1;
            width: min(100%, 580px);
            padding: clamp(1.5rem, 6vw, 3rem);
            border: 1px solid rgb(255 255 255 / 20%);
            border-radius: 2rem;
            background: rgba(28, 4, 39, 0.72);
            box-shadow: 0 24px 90px rgb(0 0 0 / 35%), 0 0 50px rgb(162 112 255 / 13%);
            backdrop-filter: blur(8px);
        }
        
        .coracao-botao {
            display: grid;
            place-items: center;
            width: min(190px, 58vw);
            aspect-ratio: 1;
            margin: 0 auto 1.25rem;
            padding: 1rem;
            border: 0;
            background: transparent;
            cursor: pointer;
            filter: drop-shadow(0 0 22px rgb(128 184 59 / 48%));
            transition: transform .2s ease, filter .2s ease;
        }
        
        .coracao-botao svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        
        .coracao-botao:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 30px rgb(128 184 59 / 78%));
        }
        
        .coracao-botao:active {
            transform: scale(.96);
        }
        
        .coracao-botao:focus-visible {
            outline: 3px solid #ffe6a3;
            outline-offset: 4px;
            border-radius: 50%;
        }
        
        #mensagem-perdao:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 2rem;
            background: rgb(0 0 0 / 72%);
            color: #fff8e7;
            font-size: clamp(1.6rem, 6vw, 2.8rem);
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 2px 16px rgb(255 105 155 / 65%);
        }
        
        #mensagem-perdao p {
            max-width: 30ch;
            margin: 0;
            font-size: clamp(1.2rem, 3vw, 2rem);
            line-height: 1.5;
            text-shadow: 0 2px 10px rgb(75 18 49 / 55%);
        }
        
        #mensagem-perdao .texto-perdao {
            display: inline-block;
            padding: .35em .8em;
            border: 1px solid rgb(255 255 255 / 40%);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 214, 228, 0.9), rgba(255, 244, 200, 0.82), rgba(214, 247, 238, 0.85));
            color: #4c1e38;
            font-weight: 800;
            box-shadow: 0 10px 24px rgb(255 194 218 / 25%), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-shadow: none;
        }
        
        .coracao-mensagem {
            width: clamp(58px, 12vw, 92px);
            height: auto;
            filter: drop-shadow(0 0 16px rgb(255 90 150 / 65%));
        }
        
        .fechar-mensagem {
            padding: .7rem 1.4rem;
            border: 1px solid rgb(255 255 255 / 65%);
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .fechar-mensagem:hover {
            background: rgb(255 255 255 / 15%);
        }
        
        .fechar-mensagem:focus-visible {
            outline: 3px solid #ffe6a3;
            outline-offset: 4px;
        }
        
        h1 {
            margin: 0 0 1rem;
            color: #ffe6a3;
            font-size: clamp(2rem, 8vw, 3.2rem);
            line-height: 1.1;
        }
        
        p {
            max-width: 38ch;
            margin: 0 auto;
            font-size: clamp(1.1rem, 4vw, 1.35rem);
            line-height: 1.7;
        }
        
        .voltar {
            display: inline-block;
            margin-top: 1.75rem;
            color: #d7c8ff;
            text-underline-offset: .25em;
        }
        
        .voltar:hover {
            color: #fff;
        }
        
        .voltar:focus-visible {
            outline: 2px solid #ffe6a3;
            outline-offset: 5px;
            border-radius: 2px;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="fogos" aria-hidden="true"></canvas>
    <main>
        <button class="coracao-botao" id="botao-coracao" type="button" aria-label="Mostrar mensagem de perdão" aria-expanded="false" aria-controls="mensagem-perdao">
      <svg role="img" aria-labelledby="titulo-ogro" viewBox="0 0 120 110" img="baixados.jpg">
        <title id="titulo-ogro">Rosto de ogro verde em estilo chibi</title>
        <path d="M38 35C23 12 5 19 8 34c2 10 12 15 28 15m46-14c15-23 33-16 30-1-2 10-12 15-28 15" fill="#568b2e" stroke="#426c26" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="13" cy="31" rx="4" ry="6" fill="#a9cf62"/>
        <ellipse cx="107" cy="31" rx="4" ry="6" fill="#a9cf62"/>
        <ellipse cx="60" cy="55" rx="34" ry="39" fill="#80b83b" stroke="#426c26" stroke-width="3"/>
        <ellipse cx="48" cy="48" rx="7" ry="9" fill="#fff8dc"/>
        <ellipse cx="72" cy="48" rx="7" ry="9" fill="#fff8dc"/>
        <circle cx="49" cy="50" r="3" fill="#26351d"/>
        <circle cx="71" cy="50" r="3" fill="#26351d"/>
        <path d="m40 36 11 2m18 0 11-2" fill="none" stroke="#426c26" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="60" cy="65" rx="11" ry="8" fill="#6d9f31"/>
        <circle cx="56" cy="64" r="1.5" fill="#547d29"/>
        <circle cx="64" cy="64" r="1.5" fill="#547d29"/>
        <path d="M48 78q12 12 24 0" fill="none" stroke="#426c26" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
        <h1>Uma surpresa para você!</h1>
        <p> Sei que agi por muitos momentos de forma impulsiva e ogro contigo, por isso quero te lembrar que ainda me importo contigo e vou mudar esse modo que você não gosta de mim😁✨</p>
    </main>
    <div id="mensagem-perdao" role="dialog" aria-modal="true" aria-label="Mensagem de perdão" hidden>
        <svg class="coracao-mensagem" aria-hidden="true" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 84 10 46C-10 25 18-5 42 13l8 8 8-8C82-5 110 25 90 46Z" fill="#f06f9b" stroke="#ffd2e0" stroke-width="3"/>
    </svg>
        <p><span class="texto-perdao">Perdão por ser um ogro de verdade (um diferente do shrek) em diversos momentos, vou melhorar por você</span></p>
        <button class="fechar-mensagem" id="fechar-mensagem" type="button">Fechar</button>
    </div>
    <script>
        (function() {
            var canvas = document.getElementById('fogos');
            var contexto = canvas.getContext('2d');
            var rostos = [];
            var cores = ['#ffcf66', '#ff6fae', '#9e83ff', '#6fe9e0', '#ffffff'];
            var largura = 0;
            var altura = 0;
            var ultimoFogo = 0;
            var movimentoReduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function ajustarCanvas() {
                var escala = Math.min(window.devicePixelRatio || 1, 2);
                largura = window.innerWidth;
                altura = window.innerHeight;
                canvas.width = largura * escala;
                canvas.height = altura * escala;
                contexto.setTransform(escala, 0, 0, escala, 0, 0);
            }

            function criarFogo() {
                var x = largura * (0.12 + Math.random() * 0.76);
                var y = altura * (0.12 + Math.random() * 0.48);
                rostos.push({
                    x: x,
                    y: y,
                    idade: 0,
                    duracao: 78,
                    cor: cores[Math.floor(Math.random() * cores.length)]
                });
            }

            function desenharOgro(rosto, progresso) {
                var surgimento = Math.min(1, progresso * 5);
                var desaparecimento = Math.min(1, (1 - progresso) * 5);
                var escala = 0.18 + surgimento * 0.9;
                var alpha = Math.min(surgimento, desaparecimento);
                var subida = progresso * -24;

                contexto.save();
                contexto.globalAlpha = alpha;
                contexto.translate(rosto.x, rosto.y + subida);
                contexto.rotate(Math.sin(progresso * Math.PI * 2) * 0.08);
                contexto.scale(escala, escala);

                // Faíscas coloridas mantêm a sensação de explosão dos fogos originais.
                for (var i = 0; i < 10; i++) {
                    var angulo = (Math.PI * 2 * i) / 10;
                    var distancia = 48 + progresso * 22;
                    contexto.globalAlpha = alpha * (1 - progresso) * 0.9;
                    contexto.fillStyle = i % 2 ? rosto.cor : '#fff1a8';
                    contexto.beginPath();
                    contexto.arc(Math.cos(angulo) * distancia, Math.sin(angulo) * distancia, 2.5, 0, Math.PI * 2);
                    contexto.fill();
                }

                contexto.globalAlpha = alpha;
                // Orelhas arredondadas e cabeça verde em estilo chibi original.
                contexto.fillStyle = '#568b2e';
                contexto.beginPath();
                contexto.moveTo(-20, -22);
                contexto.quadraticCurveTo(-43, -39, -48, -23);
                contexto.quadraticCurveTo(-50, -7, -28, -7);
                contexto.lineTo(-21, 2);
                contexto.moveTo(20, -22);
                contexto.quadraticCurveTo(43, -39, 48, -23);
                contexto.quadraticCurveTo(50, -7, 28, -7);
                contexto.lineTo(21, 2);
                contexto.fill();
                contexto.fillStyle = '#a9cf62';
                contexto.beginPath();
                contexto.ellipse(-40, -23, 5, 7, -0.5, 0, Math.PI * 2);
                contexto.ellipse(40, -23, 5, 7, 0.5, 0, Math.PI * 2);
                contexto.fill();

                contexto.fillStyle = '#80b83b';
                contexto.strokeStyle = '#426c26';
                contexto.lineWidth = 3;
                contexto.beginPath();
                contexto.ellipse(0, 0, 31, 34, 0, 0, Math.PI * 2);
                contexto.fill();
                contexto.stroke();

                contexto.fillStyle = '#fff8dc';
                contexto.beginPath();
                contexto.ellipse(-11, -7, 7, 9, 0, 0, Math.PI * 2);
                contexto.ellipse(11, -7, 7, 9, 0, 0, Math.PI * 2);
                contexto.fill();
                contexto.fillStyle = '#26351d';
                contexto.beginPath();
                contexto.arc(-10, -5, 3, 0, Math.PI * 2);
                contexto.arc(10, -5, 3, 0, Math.PI * 2);
                contexto.fill();

                contexto.strokeStyle = '#426c26';
                contexto.lineWidth = 4;
                contexto.lineCap = 'round';
                contexto.beginPath();
                contexto.moveTo(-17, -18);
                contexto.lineTo(-7, -16);
                contexto.moveTo(7, -16);
                contexto.lineTo(17, -18);
                contexto.stroke();

                contexto.fillStyle = '#6d9f31';
                contexto.beginPath();
                contexto.ellipse(0, 6, 10, 8, 0, 0, Math.PI * 2);
                contexto.fill();
                contexto.fillStyle = '#547d29';
                contexto.beginPath();
                contexto.arc(-3, 5, 1.5, 0, Math.PI * 2);
                contexto.arc(3, 5, 1.5, 0, Math.PI * 2);
                contexto.fill();

                contexto.strokeStyle = '#426c26';
                contexto.lineWidth = 2.5;
                contexto.beginPath();
                contexto.moveTo(-11, 17);
                contexto.quadraticCurveTo(0, 27, 11, 17);
                contexto.stroke();
                contexto.restore();
            }

            function animar(tempo) {
                contexto.clearRect(0, 0, largura, altura);
                if (tempo - ultimoFogo > 850) {
                    criarFogo();
                    ultimoFogo = tempo;
                }
                rostos = rostos.filter(function(rosto) {
                    rosto.idade += 1;
                    desenharOgro(rosto, rosto.idade / rosto.duracao);
                    return rosto.idade < rosto.duracao;
                });
                contexto.globalAlpha = 1;
                window.requestAnimationFrame(animar);
            }

            ajustarCanvas();
            window.addEventListener('resize', ajustarCanvas);
            if (!movimentoReduzido) window.requestAnimationFrame(animar);
        }());

        document.getElementById('botao-coracao').addEventListener('click', function() {
            var mensagem = document.getElementById('mensagem-perdao');
            mensagem.hidden = false;
            this.setAttribute('aria-expanded', 'true');
            document.getElementById('fechar-mensagem').focus();
        });

        function fecharMensagem() {
            document.getElementById('mensagem-perdao').hidden = true;
            document.getElementById('botao-coracao').setAttribute('aria-expanded', 'false');
            document.getElementById('botao-coracao').focus();
        }

        document.getElementById('fechar-mensagem').addEventListener('click', fecharMensagem);
        document.addEventListener('keydown', function(evento) {
            if (evento.key === 'Escape' && !document.getElementById('mensagem-perdao').hidden) {
                fecharMensagem();
            }
        });
    </script>
</body>

</html>
